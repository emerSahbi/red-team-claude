---
# This is a role for setting up Ivan's server.

- name: Add user ivan and set password
  user:
    name: ivan
    password: "{{ 'iluvfilms' | password_hash('sha512') }}"
    shell: '/bin/bash'

- name: Grant ivan passwordless sudo
  lineinfile:
    path: /etc/sudoers
    line: 'ivan ALL=(ALL) NOPASSWD: ALL'
    validate: 'visudo -cf %s'

- name: Install packages
  apt:
    pkg:
      - vsftpd
      - openssh-server
    update_cache: yes

- name: Configure vsftpd for anonymous login
  copy:
    src: vsftpd.conf
    dest: /etc/vsftpd.conf
    owner: root
    mode: '0644'
  notify: restart vsftpd

- name: Ensure FTP anonymous directory exists
  file:
    path: /srv/ftp
    state: directory
    owner: ftp
    group: ftp
    mode: '0755'

- name: Place backup.txt in FTP directory
  copy:
    src: backup.txt
    dest: /srv/ftp/backup.txt
    owner: ftp
    mode: '0644'

- name: Ensure vsftpd is started and enabled
  service:
    name: vsftpd
    state: started
    enabled: yes

- name: Ensure SSH is started and enabled
  service:
    name: ssh
    state: started
    enabled: yes

- name: Create alias for attacker
  lineinfile:
    path: '/etc/hosts'
    line: '192.168.30.5 attacker'
...
